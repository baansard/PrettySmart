# Runs the tests on every push to master, then deploys the game + API to Azure App Service.
#
# One-time setup (in GitHub → repo → Settings → Secrets and variables → Actions):
#   Variables tab → AZURE_WEBAPP_NAME             = your App Service name (e.g. prettysmart)
#   Secrets tab   → AZURE_WEBAPP_PUBLISH_PROFILE  = contents of the publish profile downloaded from Azure
name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test server/PrettySmart.sln

      - name: Publish
        run: dotnet publish server/PrettySmart.Api -c Release -o publish

      - name: Deploy
        if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
